version: '3.8'

services:
  backend:
    build: ./backend
    container_name: argos_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: argos_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # El túnel de Cloudflare para exponer tu backend a la API de WhatsApp
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: argos_tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    restart: unless-stopped
    depends_on:
      - backend
